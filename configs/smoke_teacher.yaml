DEVICE: cuda
SAVE_DIR: output
MODEL:
  NAME: CMNeXt
  BACKBONE: CMNeXt-B2
  PRETRAINED: ''
  RESUME: ''
DATASET:
  NAME: MFNet
  ROOT: data/MFNet
  IGNORE_LABEL: 255
  MODALS:
  - img
  - thermal
TRAIN:
  IMAGE_SIZE:
  - 480
  - 640
  BATCH_SIZE: 4
  EPOCHS: 1
  EVAL_START: 0
  EVAL_INTERVAL: 1
  AMP: true
  DDP: true
LOSS:
  NAME: CrossEntropy
  CLS_WEIGHTS: false
OPTIMIZER:
  NAME: adamw
  LR: 6.0e-05
  WEIGHT_DECAY: 0.01
SCHEDULER:
  NAME: warmuppolylr
  POWER: 0.9
  WARMUP: 10
  WARMUP_RATIO: 0.1
KD:
  ENABLE: false
  TEACHER_MODALS:
  - img
  - thermal
EVAL:
  MODEL_PATH: output/MFNet_CMNeXt-B2_imgt_teacher_s3407/best.pth
  IMAGE_SIZE:
  - 480
  - 640
  BATCH_SIZE: 4
  MSF:
    ENABLE: false
    FLIP: true
    SCALES:
    - 0.5
    - 0.75
    - 1.0
    - 1.25
    - 1.5
    - 1.75
